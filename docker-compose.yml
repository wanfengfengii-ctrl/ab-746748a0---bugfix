services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wafer-grid-reconstructor:latest
    ports:
      # API_PORT 可通过环境变量（或 .env）配置，容器内固定监听 8000
      - "${API_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  verify:
    image: wafer-grid-reconstructor:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8000
    entrypoint: ["sh", "scripts/verify"]
    restart: "no"
